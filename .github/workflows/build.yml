
name: Build EPs Video APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EPsVideo-S26-Ultra-Enhancement-Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check project ZIP exists
        run: |
          test -f EPsVideo-S26-Ultra-Enhancement-Project.zip
          echo "Project ZIP found."

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o EPsVideo-S26-Ultra-Enhancement-Project.zip -d extracted
          echo "Located Gradle project files:"
          find extracted -name settings.gradle.kts -print

      - name: Build debug APK
        run: |
          PROJECT_FILE="$(find extracted -name settings.gradle.kts -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="$(find extracted -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated at: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPs-Video-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
